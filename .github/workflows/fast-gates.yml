name: fast-gates
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions: read-all
jobs:
  fast-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (no Vault runtime, no secrets)
        run: python -m pip install --upgrade pip pytest "hvac>=2,<3" "pydantic>=2,<3" "pyyaml>=6"
      - name: policy-lint
        run: pytest tests/policy_lint -q
      - name: contract-schema
        run: pytest tests/contract -q
      - name: lifecycle/invariants
        run: pytest tests/lifecycle tests/evidence -q || true
      - name: secret-zero
        run: pytest tests/secret_zero -q || true

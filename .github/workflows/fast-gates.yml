name: fast-gates
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions: read-all
jobs:
  fast-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (no Vault runtime, no secrets)
        run: python -m pip install --upgrade pip pytest "hvac>=2,<3" "pydantic>=2,<3" "pyyaml>=6"
      - name: policy-lint
        run: pytest tests/policy_lint -q
      - name: contract-schema
        run: pytest tests/contract -q
      # Fail-closed: rc=0 pass; rc=5 (no tests collected) tolerated only for
      # these planned-but-empty suites; rc=1,2,3,4 propagate and fail the job.
      - name: lifecycle/invariants
        run: |
          rc=0
          pytest tests/lifecycle tests/evidence -q || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
            echo "lifecycle/invariants failed (rc=$rc)"; exit "$rc"
          fi
      - name: secret-zero
        run: |
          rc=0
          pytest tests/secret_zero -q || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
            echo "secret-zero failed (rc=$rc)"; exit "$rc"
          fi
      - name: live-readiness-static
        run: pytest tests/plans/test_live_readiness_decisions.py tests/baseline/test_compose_architecture.py tests/baseline/test_tls_material.py -q

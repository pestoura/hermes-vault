name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, epic-00/discovery-prerequisites, epic-01/baseline-adoption]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q tools tests

      - name: Validate immutable LAB_L1 source contract
        run: python tools/validate_lab_l1_source.py baseline/lab-l1-source.json

      - name: Validate workload identity contract
        run: python tools/validate_identity_contract.py identity/workload-roles.json

      - name: Lint Vault workload policies
        run: python tools/lint_vault_policies.py identity/policies

      - name: Check shell syntax
        run: find operations -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Run repository contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Repository high-confidence secret marker guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -e '-----BEGIN( [A-Z0-9]+)? PRIVATE KEY-----' -- . ':!tests/**'; then
            echo 'Private-key material marker found outside synthetic tests.' >&2
            exit 1
          fi
          if git grep -nE -e 'gh[pousr]_[A-Za-z0-9_]{20,}' -- . ':!tests/**'; then
            echo 'GitHub token-shaped value found outside synthetic tests.' >&2
            exit 1
          fi

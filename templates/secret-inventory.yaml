# Hermes Vault Phase 0 sanitized inventory template.
# NEVER put a secret/token/password/private-key value in this file.
schema: hermes-vault-secret-inventory/v1
secrets:
  - id: SEC-000
    name: EXAMPLE_TOKEN_NAME
    source_type: env
    source_path: /sanitized/reference/path
    consumer_hint: example-consumer
    provider_hint: example-provider
    classification: static
    accessible: true
    privilege_scope: unknown
    owner: unassigned
    rotation_supported: unknown
    dynamic_secret_candidate: false
    pki_candidate: false
    transit_candidate: false
    target_vault_mount: secret
    target_vault_path: jarvas/example/runtime
    proposed_identity: example-consumer
    proposed_policy: example-consumer
    rollback_defined: false
    acceptance_test_defined: false
    status: discovered
    notes: Reference metadata only; no secret value in Git.

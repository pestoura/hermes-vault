services:
  vault:
    image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    user: "100:1000"
    command: server
    cap_drop: ["ALL"]
    read_only: true
    security_opt: ["no-new-privileges"]
    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/certs/ca.pem"
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
      - vault-audit:/vault/logs
      - ./certs:/vault/certs:ro   # TLS material mounted read-only; server key group-readable by pinned Vault gid 1000
    ports:
      - "127.0.0.1:8200:8200"     # loopback operator access only; never LAN/Internet
    networks:
      hermes-security-plane:
        aliases:
          - hermes-vault
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  vault-data:
  vault-audit:
networks:
  hermes-security-plane:
    name: hermes-security-plane
    internal: true
